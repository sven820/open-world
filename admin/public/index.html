<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WalkStreet · 广告大屏内容管理后台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2337e6d5'/%3E%3Crect x='12' y='16' width='40' height='28' rx='3' fill='%230b1018'/%3E%3Crect x='28' y='44' width='8' height='8' fill='%230b1018'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="brand-mark">▣</div>
        <div>
          <b>WALKSTREET</b>
          <small>数字标牌内容管理</small>
        </div>
      </div>

      <nav id="nav" class="nav">
        <button class="nav-item" data-view="dashboard"><i>◈</i><span>概览</span></button>
        <button class="nav-item" data-view="media"><i>▧</i><span>素材库</span></button>
        <button class="nav-item" data-view="playlists"><i>☰</i><span>节目单</span></button>
        <button class="nav-item" data-view="screens"><i>▣</i><span>屏位绑定</span></button>
        <button class="nav-item" data-view="publish"><i>⇧</i><span>发布</span></button>
        <button class="nav-item" data-view="test"><i>⌁</i><span>接入测试</span></button>
      </nav>

      <div class="side-foot">
        <div class="side-status"><span id="svc-dot" class="dot"></span><span id="svc-text">正在连接服务…</span></div>
        <div class="side-meta">终端已确认版本 <b id="side-ack">—</b></div>
        <div class="side-meta">发布版本 v<b id="side-ver">0</b> · 零依赖 Node 服务</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="top-title">
          <h1 id="page-title">概览</h1>
          <p id="page-sub"></p>
        </div>
        <div class="top-actions">
          <span id="pending-chip" class="chip">—</span>
          <button id="btn-refresh" class="btn ghost" title="刷新数据">↻ 刷新</button>
          <button id="btn-game" class="btn primary">▶ 打开游戏</button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
